# El instalador de la prueba con una persona real (docs/plan.md). Se arma en Windows porque la PC de desarrollo es
# Linux: corre todas las pruebas, publica el servicio y la caja, prepara la base y los ejemplos, y deja
# PapeleriaPos-Prueba.exe como artefacto de la corrida.
#
# Con lo mismo que publica deja también el paquete para actualizar una PC de la tienda (la caja 2 del piloto) con
# actualizar.ps1: PapeleriaPos-Actualizacion-1.0.<corrida> (docs/pruebas-en-tienda.md, «Actualizar la caja 2 del piloto»).
# Los .exe llevan esa versión (1.0.<número de esta corrida>, el mismo número que el instalador de prueba).
name: Instalador de prueba

on:
  workflow_dispatch:
  push:
    tags: ['prueba-*']
  pull_request:
    paths: ['instalacion/**', '.github/workflows/prueba.yml']

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas
        run: dotnet test -c Release

      # Como siempre (Release, win-x64, con .NET adentro) en publicar/servicio y publicar/caja, con su versión, más actualizar.ps1.
      - name: Publicar el servicio y la caja
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File instalacion\armar-paquete.ps1 -Version 1.0.${{ github.run_number }} -Salida publicar

      - name: Base y ejemplos de la prueba
        run: dotnet run --project src/PapeleriaPos.Herramientas -c Release -- preparar-prueba --salida publicar/datos/prueba.db --ejemplos publicar/ejemplos

      - name: Instalador
        shell: pwsh
        env:
          VERSION_PRUEBA: ${{ github.ref_name }}.${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc instalacion/prueba.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: PapeleriaPos-Prueba
          path: publicar/PapeleriaPos-Prueba.exe
          retention-days: 30

      # El paquete para actualizar una PC de la tienda: actualizar.ps1, servicio\ y caja\ (sin lo de la prueba).
      - uses: actions/upload-artifact@v4
        with:
          name: PapeleriaPos-Actualizacion-1.0.${{ github.run_number }}
          path: |
            publicar/actualizar.ps1
            publicar/servicio
            publicar/caja
          retention-days: 30
