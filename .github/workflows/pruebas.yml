# Las pruebas en cada PR, también en los apilados sobre otro PR. En Windows corren todas (la tienda es Windows); en
# Linux, las de PapeleriaPos.Pruebas (las de la medición son solo de Windows), porque ahí se programa. Los PR que solo
# cambian documentación no las corren, y un push nuevo cancela la corrida anterior del mismo PR: el repositorio es
# privado y los minutos de Windows cuentan doble.
name: Pruebas

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: pruebas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas
        run: dotnet test -c Release

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas
        run: dotnet test tests/PapeleriaPos.Pruebas -c Release
