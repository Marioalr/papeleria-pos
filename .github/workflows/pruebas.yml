# Las pruebas en cada PR, también en los apilados sobre otro PR. En Windows corren todas (la tienda es Windows); en
# Linux, porque ahí se programa, las del POS (PapeleriaPos.Pruebas) y las del módulo de impresión que no necesitan
# Windows (tests/Impresiones/PapeleriaPos.Impresiones.Pruebas; las de su agente son solo de Windows). Los PR que solo
# cambian documentación no las corren, y un push nuevo cancela la corrida anterior del mismo PR: el repositorio es
# privado y los minutos de Windows cuentan doble.
#
# La regla «Pruebas antes de fusionar» de main pide que «windows» y «linux» pasen. Por eso un PR de solo documentación no
# se salta todo el flujo (con paths-ignore las dos se quedaban esperando y el PR no se podía fusionar, como el #81): las
# dos se saltan con su condición, y GitHub cuenta un trabajo saltado como aprobado. Por lo mismo, solo se saltan si
# «cambios» dijo que es solo documentación: si «cambios» falla, corren (si no, un PR con código pasaría sin pruebas).
name: Pruebas

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: pruebas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Si el PR cambia algo más que documentación (docs/ y los .md). A mano (workflow_dispatch), siempre corren.
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      codigo: ${{ steps.revisar.outputs.codigo }}
    steps:
      - id: revisar
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! archivos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "No se pudo ver qué cambia: las pruebas corren."
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$archivos"
          if echo "$archivos" | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Solo documentación: las pruebas se saltan."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: cambios
    if: ${{ !cancelled() && needs.cambios.outputs.codigo != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas
        run: dotnet test -c Release

  linux:
    needs: cambios
    if: ${{ !cancelled() && needs.cambios.outputs.codigo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas
        run: dotnet test tests/PapeleriaPos.Pruebas -c Release

      - name: Pruebas del módulo de impresión
        run: dotnet test tests/Impresiones/PapeleriaPos.Impresiones.Pruebas -c Release
