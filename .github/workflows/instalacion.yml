# La prueba de los scripts de instalacion/ en Windows (docs/pruebas-en-tienda.md, «Actualizar la caja 2 del piloto»): arma dos
# paquetes, instala el primero como en la tienda, lo actualiza al segundo sin perder la base ni servicio.json, regresa sola de una
# actualización que no arranca, pasa a Archivos de programa un servicio instalado como antes, restaura respaldos (con
# restaurar.ps1 y desde la API, con el servicio que Windows vuelve a arrancar solo) y al final quita todo.
#
# No corre las pruebas del POS (eso es pruebas.yml): solo publica y usa los scripts, con Windows PowerShell 5.1 como en la
# tienda. Cada paso dice qué revisa («bien: …»); lo que no se cumple sale como error con su porqué, y el paso «Si algo falló»
# enseña los registros de actualizar.ps1 y lo que dijo Windows del servicio.
name: Instalación

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'instalacion/**'
      - 'src/PapeleriaPos.Servicio/**'
      - 'src/PapeleriaPos.Caja/**'
      - 'Directory.Build.props'
      - '.github/instalacion/**'
      - '.github/workflows/instalacion.yml'

concurrency:
  group: instalacion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # Antes de armar nada: que Windows PowerShell 5.1 pueda leer todos los scripts. Así salen juntos todos los errores de
      # sintaxis, y no uno por corrida.
      - name: Los scripts se leen sin errores
        shell: powershell
        run: |
          $errores = 0
          foreach ($archivo in @(Get-ChildItem -Recurse -File -Filter *.ps1 -Path instalacion, .github\instalacion)) {
            $fallas = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($archivo.FullName, [ref]$null, [ref]$fallas)
            foreach ($falla in $fallas) {
              Write-Host "::error file=$($archivo.FullName),line=$($falla.Extent.StartLineNumber)::$($falla.Message)"
              $errores++
            }
          }
          if ($errores -gt 0) { throw "$errores errores de sintaxis en los scripts" }
          Write-Host 'Todos los scripts se leen bien.'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Para la marca en la base (sqlite3 viene con Python).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Armar el paquete 1.0.1, el 1.0.2 y uno 1.0.3 que no arranca
        run: |
          . .github\instalacion\ayudas.ps1
          foreach ($v in '1', '2') {
            $r = Correr instalacion\armar-paquete.ps1 @('-Version', "1.0.$v", '-Salida', (Join-Path $Paquetes "v$v"), '-Rapido')
            Que ($r.Codigo -eq 0) "se armo el paquete 1.0.$v"
          }
          Que ((Version-De (Join-Path $Paquetes 'v2\caja\PapeleriaPos.Caja.exe')) -eq '1.0.2') 'la caja del paquete 1.0.2 dice 1.0.2'
          Que (Test-Path (Join-Path $Paquetes 'v2\actualizar.ps1')) 'el paquete trae actualizar.ps1'
          Que (Test-Path (Join-Path $Paquetes 'v2\servicio\plantilla-servicio.json')) 'y la plantilla de servicio.json'
          # Un programa que termina en seguida (sin nada) o a los segundos que se le digan: el servicio que no arranca y la caja
          # abierta de mentiras.
          Add-Type -OutputType ConsoleApplication -OutputAssembly $ProgramaQueTermina -TypeDefinition @'
          using System.Reflection;
          [assembly: AssemblyFileVersion("1.0.3.0")]
          [assembly: AssemblyInformationalVersion("1.0.3")]
          public static class Programa
          {
              public static int Main(string[] argumentos)
              {
                  int segundos;
                  if (argumentos.Length > 0 && int.TryParse(argumentos[0], out segundos))
                      System.Threading.Thread.Sleep(segundos * 1000);
                  return 3;
              }
          }
          '@
          Que ((Version-De $ProgramaQueTermina) -eq '1.0.3') 'el programa que termina dice 1.0.3'
          Copy-Item -LiteralPath (Join-Path $Paquetes 'v2') -Destination (Join-Path $Paquetes 'roto') -Recurse
          Copy-Item -LiteralPath $ProgramaQueTermina -Destination (Join-Path $Paquetes 'roto\servicio\PapeleriaPos.Servicio.exe') -Force
          Que ((Version-De (Join-Path $Paquetes 'roto\servicio\PapeleriaPos.Servicio.exe')) -eq '1.0.3') 'el paquete roto trae un servicio 1.0.3 que termina en seguida'

      - name: Instalar el 1.0.1 como en la tienda
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Paquetes 'v1\servicio\instalar-servicio.ps1')
          Que ($r.Codigo -eq 0) 'instalar-servicio.ps1 termino bien'
          $r = Correr (Join-Path $Paquetes 'v1\caja\instalar-caja.ps1')
          Que ($r.Codigo -eq 0) 'instalar-caja.ps1 termino bien'
          Que ((Ruta-Del-Servicio) -eq "`"$ExeServicio`"") 'el servicio corre desde Archivos de programa'
          Que (Regla-Del-Firewall) 'abrio el firewall para las cajas'
          Que ((Version-De $ExeCaja) -eq '1.0.1') 'la caja 1.0.1 esta en Archivos de programa'
          Que ((Get-Content -LiteralPath $ServicioJson -Raw) -match 'Eleventa__Clave') 'se puso la plantilla de servicio.json'
          $estado = Esperar-Version '1.0.1'
          Que ($null -ne $estado) 'api/estado contesta con la 1.0.1'
          Que (-not $estado.pilotoEleventa) 'sin el puente: la plantilla no trae ajustes'

      - name: Una marca en la base y otra en servicio.json
        run: |
          . .github\instalacion\ayudas.ps1
          Que (Marca poner) 'la marca quedo en la base, con el servicio en marcha'
          # El puente prendido, sin servidor ni clave: no se conecta a nada, pero api/estado lo dice (pilotoEleventa).
          $json = "// La configuracion de esta PC en la prueba de instalacion.`r`n{`r`n  `"Eleventa`": { `"Escribir`": true }`r`n}`r`n"
          [IO.File]::WriteAllText($ServicioJson, $json, (New-Object System.Text.UTF8Encoding $false))
          Set-Content -LiteralPath $HuellaServicioJson -Value (Huella-De-ServicioJson)
          Restart-Service -Name PapeleriaPos
          $estado = Esperar-Version '1.0.1'
          Que ($estado.pilotoEleventa -eq $true) 'el servicio instalado lee C:\ProgramData\PapeleriaPos\servicio.json'

      - name: Instalar otra vez no se deja
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Paquetes 'v2\servicio\instalar-servicio.ps1')
          Que ($r.Codigo -ne 0) 'instalar-servicio.ps1 no se pone encima'
          Que ($r.Texto -match 'actualizar\.ps1') 'y dice que una version nueva va con actualizar.ps1'
          Que ((Version-De $ExeServicio) -eq '1.0.1') 'el servicio sigue en la 1.0.1'

      - name: Actualizar al 1.0.2 con la caja abierta (se cierra sola a los 20 s)
        run: |
          . .github\instalacion\ayudas.ps1
          $caja = Abrir-Caja-De-Mentiras 20
          $r = Correr (Join-Path $Paquetes 'v2\actualizar.ps1')
          Que ($r.Codigo -eq 0) 'actualizar.ps1 termino bien'
          Que ($r.Texto -match 'La caja esta abierta') 'pidio cerrar la caja y espero'
          $caja.WaitForExit()
          Que ($caja.ExitCode -eq 3) 'la caja se cerro sola: no a la fuerza'
          Que ($r.Texto -match 'Actualizado de 1\.0\.1 a 1\.0\.2') 'dice: Actualizado de 1.0.1 a 1.0.2'
          $estado = Esperar-Version '1.0.2' 30
          Que ($null -ne $estado) 'api/estado contesta con la 1.0.2'
          Que ($estado.pilotoEleventa -eq $true) 'con lo de servicio.json'
          Que ((Huella-De-ServicioJson) -eq (Get-Content -LiteralPath $HuellaServicioJson)) 'servicio.json quedo igual'
          Que (Marca revisar) 'la marca sigue en la base'
          Que ((Version-De $ExeServicio) -eq '1.0.2') 'el servicio de Archivos de programa es el 1.0.2'
          Que ((Version-De $ExeCaja) -eq '1.0.2') 'la caja de Archivos de programa es la 1.0.2'
          Que (-not (Test-Path (Join-Path $Programa 'Caja\de-mentiras'))) 'la carpeta de la caja es la del paquete'
          $respaldos = Respaldos
          Que ($respaldos.Count -eq 1) 'hay un respaldo'
          $respaldo = $respaldos[0].FullName
          Set-Content -LiteralPath $PrimerRespaldo -Value $respaldo
          Que ($respaldos[0].Name -match '^\d{4}-\d{2}-\d{2}_\d{2}\.\d{2}\.\d{2}-1\.0\.1$') "con la fecha y la version de antes en el nombre ($($respaldos[0].Name))"
          Que (Test-Path (Join-Path $respaldo 'base\pos.db')) 'con la base'
          Que ((Version-De (Join-Path $respaldo 'servicio\PapeleriaPos.Servicio.exe')) -eq '1.0.1') 'con el servicio de antes'
          Que ((Version-De (Join-Path $respaldo 'caja\PapeleriaPos.Caja.exe')) -eq '1.0.1') 'con la caja de antes'
          Que (Test-Path (Join-Path $respaldo 'actualizar.log')) 'y con el registro'

      - name: Una version anterior no se pone
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Paquetes 'v1\actualizar.ps1')
          Que ($r.Codigo -eq 1) 'actualizar.ps1 se nego'
          Que ($r.Texto -match 'version anterior') 'porque es una version anterior'
          Que ((Respaldos).Count -eq 1) 'sin tocar nada: ni un respaldo nuevo'
          Que ((Estado).version -eq '1.0.2') 'el servicio sigue en la 1.0.2'

      - name: La misma version, solo con -Forzar
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Paquetes 'v2\actualizar.ps1')
          Que ($r.Codigo -eq 0) 'sin -Forzar termino bien'
          Que ($r.Texto -match 'Ya esta instalada') 'y dijo que ya esta instalada'
          Que ((Respaldos).Count -eq 1) 'sin respaldo nuevo'
          $r = Correr (Join-Path $Paquetes 'v2\actualizar.ps1') @('-Forzar')
          Que ($r.Codigo -eq 0) 'con -Forzar la volvio a poner'
          Que ($r.Texto -match 'Actualizado de 1\.0\.2 a 1\.0\.2') 'dice: Actualizado de 1.0.2 a 1.0.2'
          Que ((Respaldos).Count -eq 2) 'con su respaldo'
          Que (Marca revisar) 'la marca sigue en la base'

      - name: Una actualizacion que no arranca regresa sola a la 1.0.2
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Paquetes 'roto\actualizar.ps1')
          Que ($r.Codigo -eq 1) 'actualizar.ps1 dice que no quedo (codigo 1)'
          Que ($r.Texto -match 'Se regreso a la version 1\.0\.2') 'dice que regreso a la 1.0.2'
          Que ($r.Texto -match 'actualizar\.log') 'y donde quedo el registro'
          $estado = Esperar-Version '1.0.2' 60
          Que ($null -ne $estado) 'api/estado contesta con la 1.0.2'
          Que ($estado.pilotoEleventa -eq $true) 'con lo de servicio.json'
          Que ((Version-De $ExeServicio) -eq '1.0.2') 'el programa del servicio es otra vez el 1.0.2'
          Que ((Get-Service -Name PapeleriaPos).StartType -eq 'Automatic') 'el servicio queda automatico'
          Que (Marca revisar) 'la marca sigue en la base'
          Que ((Huella-De-ServicioJson) -eq (Get-Content -LiteralPath $HuellaServicioJson)) 'servicio.json quedo igual'
          Que ((Respaldos).Count -eq 3) 'quedo el respaldo de este intento'

      - name: Un servicio instalado como antes (fuera de Archivos de programa) pasa a Archivos de programa
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Programa 'Servicio\instalar-servicio.ps1') @('-Quitar')
          Que ($r.Codigo -eq 0) 'instalar-servicio.ps1 -Quitar, desde Archivos de programa, termino bien'
          Que (Esperar-Sin-Servicio) 'ya no esta el servicio'
          Que (-not (Test-Path (Join-Path $Programa 'Servicio'))) 'ni su carpeta en Archivos de programa'
          Que (-not (Regla-Del-Firewall)) 'ni su regla del firewall'
          Que ((Test-Path $Base) -and (Test-Path $ServicioJson)) 'la base y servicio.json se quedan'
          # Como lo dejaba el instalar-servicio.ps1 de antes: registrado desde la carpeta donde se corria.
          $viejo = 'C:\PapeleriaPos-de-antes\Servicio'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $viejo) | Out-Null
          Copy-Item -LiteralPath (Join-Path $Paquetes 'v1\servicio') -Destination $viejo -Recurse
          New-Service -Name PapeleriaPos -BinaryPathName "`"$viejo\PapeleriaPos.Servicio.exe`"" -DisplayName 'Papeleria POS' -StartupType Automatic | Out-Null
          sc.exe failure PapeleriaPos reset= 86400 actions= restart/5000/restart/5000/restart/60000 | Out-Null
          Start-Service -Name PapeleriaPos
          $estado = Esperar-Version '1.0.1'
          Que ($null -ne $estado -and $estado.pilotoEleventa) 'el servicio de antes contesta con la 1.0.1 y lee servicio.json'
          # Un ajuste propio en su appsettings.json: actualizar no sigue sin que se pase a servicio.json.
          $appsettings = Join-Path $viejo 'appsettings.json'
          $original = Get-Content -LiteralPath $appsettings -Raw -Encoding UTF8
          [IO.File]::WriteAllText($appsettings, ($original -replace '^\s*\{', '{ "Respaldos": { "Dias": 45 },'), (New-Object System.Text.UTF8Encoding $false))
          $r = Correr (Join-Path $Paquetes 'v2\actualizar.ps1')
          Que ($r.Codigo -eq 1) 'con un ajuste propio en appsettings.json, actualizar.ps1 no sigue'
          Que ($r.Texto -match 'Respaldos:Dias') 'y dice cual se perderia'
          Que ((Ruta-Del-Servicio) -like '*PapeleriaPos-de-antes*') 'el servicio sigue donde estaba'
          Que ((Respaldos).Count -eq 3) 'sin respaldo nuevo'
          [IO.File]::WriteAllText($appsettings, $original, (New-Object System.Text.UTF8Encoding $false))
          # Ya sin el ajuste, y con la caja abierta: -Forzar la cierra.
          $caja = Abrir-Caja-De-Mentiras 600
          $r = Correr (Join-Path $Paquetes 'v2\actualizar.ps1') @('-Forzar')
          Que ($r.Codigo -eq 0) 'actualizar.ps1 -Forzar termino bien'
          Que ($r.Texto -match 'Actualizado de 1\.0\.1 a 1\.0\.2') 'dice: Actualizado de 1.0.1 a 1.0.2'
          Que ($caja.HasExited) 'cerro la caja a la fuerza (-Forzar)'
          Que ((Ruta-Del-Servicio) -eq "`"$ExeServicio`"") 'el servicio ahora corre desde Archivos de programa'
          Que (Test-Path "$viejo\PapeleriaPos.Servicio.exe") 'la carpeta de antes no se toco'
          $estado = Esperar-Version '1.0.2' 30
          Que ($null -ne $estado -and $estado.pilotoEleventa) 'api/estado contesta con la 1.0.2 y lee servicio.json'
          Que (Marca revisar) 'la marca sigue en la base'
          Que ((Huella-De-ServicioJson) -eq (Get-Content -LiteralPath $HuellaServicioJson)) 'servicio.json quedo igual'
          Que ((Respaldos).Count -eq 3) 'se guardan los ultimos 3 respaldos'
          Que (-not (Test-Path (Get-Content -LiteralPath $PrimerRespaldo))) 'el mas viejo se borro'

      # Restaurar un respaldo (docs/pruebas-en-tienda.md, «Restaurar un respaldo» y «Si la base se daña»). Primero con
      # restaurar.ps1, que pone una base de la papelería ficticia con la caja y los usuarios de prueba: con ella se prueba
      # después restaurar desde la pantalla (la API), y al final el peor caso, con la base que ni deja arrancar al servicio.
      - name: Restaurar un respaldo con restaurar.ps1 (y de paso una base con usuarios)
        run: |
          . .github\instalacion\ayudas.ps1
          $ficticia = Join-Path $env:RUNNER_TEMP 'ficticia.db'
          & dotnet run --project src\PapeleriaPos.Herramientas -c Release -- generar-ficticios --salida $ficticia --reemplazar
          Que ($LASTEXITCODE -eq 0) 'se armo la base de la papeleria ficticia'
          & dotnet run --project src\PapeleriaPos.Herramientas -c Release --no-build -- preparar-caja --base $ficticia
          Que ($LASTEXITCODE -eq 0) 'con la caja 1 y los usuarios de prueba'
          # Como un respaldo del servicio: copia en linea de SQLite, en la carpeta de respaldos.
          $respaldos = Join-Path $Datos 'respaldos'
          New-Item -ItemType Directory -Force -Path $respaldos | Out-Null
          $nombre = 'pos-{0:yyyy-MM-dd}-ahora-0001.db' -f (Get-Date)
          & python (Join-Path $Ayudas 'marca.py') respaldar $ficticia (Join-Path $respaldos $nombre)
          Que ($LASTEXITCODE -eq 0) "el respaldo $nombre esta en la carpeta de respaldos"
          $global:LASTEXITCODE = 0
          $baseAntes = (Estado).base
          $r = Correr (Join-Path $Programa 'Servicio\restaurar.ps1') @('-Respaldo', $nombre, '-Si')
          Que ($r.Codigo -eq 0) 'restaurar.ps1 termino bien'
          Que ($r.Texto -match 'Se restauro el respaldo') 'y dice que se restauro'
          $estado = Esperar-Version '1.0.2' 60
          Que ($null -ne $estado -and -not $estado.avisoBase) 'el servicio contesta, sin aviso de la base'
          Que ($estado.base -ne $baseAntes) 'con otra base de la copia: las cajas bajan la suya completa'
          Que (-not (Marca revisar)) 'la base es la del respaldo: no tiene la marca de antes'
          $aparte = Carpetas-De-Antes
          Que ($aparte.Count -eq 1) "la base de antes quedo aparte ($($aparte.Name))"
          Que (Test-Path (Join-Path $aparte[0].FullName 'pos.db')) 'con su pos.db'
          Que (Test-Path (Join-Path $aparte[0].FullName 'restaurar.log')) 'y el registro de restaurar.ps1'
          Que (-not (Test-Path (Join-Path $Datos 'pos.db.danada'))) 'la base restaurada paso la revision: el servicio quito la marca'
          Que (-not (Test-Path (Join-Path $Datos 'pos.db.restaurar'))) 'el servicio termino lo de despues de migrar'
          Que ((Get-Service -Name PapeleriaPos).StartType -eq 'Automatic') 'el servicio sigue automatico'
          # La marca de siempre, ya en la base restaurada: la revisan los pasos de despues.
          Que (Marca poner) 'la marca otra vez, en la base restaurada'

      - name: Restaurar desde la pantalla (la API) - el servicio se detiene y Windows lo vuelve a arrancar solo
        run: |
          . .github\instalacion\ayudas.ps1
          $dueno = Api 'sesion' @{ usuario = 'dueno'; pin = '3333' }
          $caja = @(Api 'cajas')[0]
          $respaldos = "cajas/$($caja.id)/configuracion/respaldos"
          # Respaldar ahora, y que termine.
          $r = Api $respaldos @{ usuarioId = $dueno.usuarioId }
          $limite = (Get-Date).AddMinutes(2)
          while ($r.ahora.haciendo -and (Get-Date) -lt $limite) { Start-Sleep -Seconds 1; $r = Api "$respaldos`?usuarioId=$($dueno.usuarioId)" }
          Que ($null -ne $r.ahora.hecho) "Respaldar ahora termino ($($r.ahora.hecho.ruta))"
          $archivo = Split-Path -Leaf $r.ahora.hecho.ruta
          $lista = Api "$respaldos/lista?usuarioId=$($dueno.usuarioId)"
          # El tipo va como numero (TipoRespaldo: 0 diario, 1 corte Z, 2 Respaldar ahora).
          Que (@($lista.respaldos | Where-Object { $_.archivo -eq $archivo -and $_.tipo -eq 2 }).Count -eq 1) 'esta en la lista para restaurar'
          Que ($lista.reinicioAutomatico -eq $true) 'como servicio de Windows, con el reinicio automatico'
          # Despues del respaldo, otra marca: al restaurar se pierde.
          Que (Marca poner 'despues del respaldo') 'una marca despues del respaldo'
          $baseAntes = (Estado).base
          $procesoAntes = Proceso-Del-Servicio
          $pedido = Get-Date
          # Otro PIN no.
          $rechazo = $null
          try { Api "$respaldos/restaurar" @{ usuarioId = $dueno.usuarioId; pin = '1111'; archivo = $archivo } | Out-Null } catch { $rechazo = $_ }
          Que ($null -ne $rechazo) 'con otro PIN no se restaura'
          $r = Api "$respaldos/restaurar" @{ usuarioId = $dueno.usuarioId; pin = '3333'; archivo = $archivo }
          Que ($r.restauracion.pendiente -eq $true -and $r.restauracion.reinicioAutomatico -eq $true) 'se pidio, y el servicio se reinicia solo'
          # Windows lo vuelve a arrancar con sus acciones de recuperacion (sc failure: a los 5 s, 5 s y luego al minuto).
          $limite = (Get-Date).AddMinutes(4)
          do { Start-Sleep -Seconds 2; $estado = Estado } while ((-not $estado -or $estado.base -eq $baseAntes) -and (Get-Date) -lt $limite)
          Que ($null -ne $estado -and $estado.base -ne $baseAntes) "Windows lo volvio a arrancar solo, en $([int]((Get-Date) - $pedido).TotalSeconds) s"
          Que ((Proceso-Del-Servicio) -ne $procesoAntes) 'es otro proceso'
          Que (-not $estado.avisoBase) 'sin aviso de la base'
          $r = Api "$respaldos`?usuarioId=$($dueno.usuarioId)"
          Que ($r.restauracion.pendiente -eq $false -and $r.restauracion.hechaLocal) "dice que se restauro; la base de antes en $($r.restauracion.baseDeAntes)"
          Que (Marca revisar) 'la marca de antes del respaldo sigue'
          Que (-not (Marca revisar 'despues del respaldo')) 'la de despues ya no'
          Que ((Carpetas-De-Antes).Count -eq 2) 'la base de antes, aparte, junto a la otra'
          Que ((Get-Service -Name PapeleriaPos).Status -eq 'Running') 'el servicio en marcha'
          # Al arrancar con el respaldo hizo el suyo (TipoRespaldo 4, «Al restaurar»): lo mas reciente es de la base restaurada.
          $lista = Api "$respaldos/lista?usuarioId=$($dueno.usuarioId)"
          Que (@($lista.respaldos)[0].tipo -eq 4) "el mas reciente es el que hizo al restaurar ($(@($lista.respaldos)[0].archivo))"
          Write-Host 'Lo que dijo Windows del servicio:'
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; StartTime = $pedido } -MaxEvents 20 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Papeleria' } | ForEach-Object { Write-Host "  [$($_.TimeCreated)] $($_.Id): $($_.Message)" }

      - name: El peor caso - la base no deja ni arrancar al servicio, y restaurar.ps1 la regresa
        run: |
          . .github\instalacion\ayudas.ps1
          Stop-Service -Name PapeleriaPos
          # Basura en el encabezado: SQLite ya no la reconoce, no se migra y el servicio se cae al arrancar (Windows lo reintenta).
          $bytes = [IO.File]::ReadAllBytes($Base)
          for ($i = 0; $i -lt 100; $i++) { $bytes[$i] = 0 }
          [IO.File]::WriteAllBytes($Base, $bytes)
          Start-Service -Name PapeleriaPos -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 20
          Que ($null -eq (Estado)) 'con la base danada, el servicio no contesta'
          # El respaldo mas reciente (el que hizo el servicio al restaurar en el paso de antes), sin preguntar.
          $r = Correr (Join-Path $Programa 'Servicio\restaurar.ps1') @('-Respaldo', '1', '-Si')
          Que ($r.Codigo -eq 0) 'restaurar.ps1 termino bien'
          $estado = Esperar-Version '1.0.2' 60
          Que ($null -ne $estado -and -not $estado.avisoBase) 'el servicio contesta otra vez, sin aviso'
          Que (Marca revisar) 'con la base del respaldo (la marca esta)'
          Que ((Carpetas-De-Antes).Count -eq 3) 'la base danada quedo aparte, sin borrarla'
          Que ((Get-Service -Name PapeleriaPos).StartType -eq 'Automatic') 'el servicio sigue automatico'

      # Revision del PR #136: si el respaldo no cabe en el disco, restaurar.ps1 no toca nada; si algo falla al apartar la base, la
      # regresa a su lugar y deja el servicio como estaba (antes lo dejaba detenido y deshabilitado).
      - name: Restaurar sin espacio o con un archivo ocupado - la base se queda (o regresa) y el servicio sigue
        run: |
          . .github\instalacion\ayudas.ps1
          $antes = (Carpetas-De-Antes).Count
          # Un respaldo que no cabe: un archivo disperso mas grande que el espacio libre (no ocupa el disco).
          $enorme = Join-Path $Datos ('respaldos\pos-{0:yyyy-MM-dd}-ahora-0002.db' -f (Get-Date))
          $libre = (New-Object System.IO.DriveInfo ([IO.Path]::GetPathRoot($Datos))).AvailableFreeSpace
          New-Item -ItemType File -Path $enorme -Force | Out-Null
          & fsutil sparse setflag $enorme | Out-Null
          $archivo = [IO.File]::Open($enorme, 'Open', 'ReadWrite')
          $archivo.SetLength($libre + 1GB)
          $archivo.Dispose()
          $global:LASTEXITCODE = 0
          $r = Correr (Join-Path $Programa 'Servicio\restaurar.ps1') @('-Respaldo', (Split-Path -Leaf $enorme), '-Si')
          Remove-Item -LiteralPath $enorme -Force
          Que ($r.Codigo -eq 1) 'no cabe: restaurar.ps1 sale con 1'
          Que ($r.Texto -match 'No hay espacio en el disco') 'y dice que no hay espacio'
          Que ((Carpetas-De-Antes).Count -eq $antes) 'sin tocar la base: no hay otra carpeta de antes'
          Que ((Get-Service -Name PapeleriaPos).Status -eq 'Running') 'el servicio sigue en marcha'
          # Un archivo de la base ocupado mientras se aparta (la marca de la base danada, abierta por otro programa): la base ya
          # movida regresa a su lugar y el servicio vuelve a arrancar, automatico como estaba.
          $marcaDanada = Join-Path $Datos 'pos.db.danada'
          [IO.File]::WriteAllText($marcaDanada, 'la prueba la tiene abierta')
          $candado = [IO.File]::Open($marcaDanada, 'Open', 'Read', 'None')
          try {
            $r = Correr (Join-Path $Programa 'Servicio\restaurar.ps1') @('-Respaldo', '1', '-Si')
          } finally {
            $candado.Dispose()
          }
          Que ($r.Codigo -eq 1) 'no se pudo apartar: restaurar.ps1 sale con 1'
          Que ($r.Texto -match 'La base de antes regreso a su lugar') 'y dice que la base regreso a su lugar'
          Que (Test-Path $Base) 'la base esta en su lugar'
          Que ((Get-Service -Name PapeleriaPos).StartType -eq 'Automatic') 'el servicio sigue automatico'
          $estado = Esperar-Version '1.0.2' 90
          Que ($null -ne $estado -and -not $estado.avisoBase) 'el servicio arranco otra vez, sin aviso de la base'
          Que (Marca revisar) 'con la misma base (la marca esta)'
          $aparte = @(Carpetas-De-Antes | Sort-Object Name)
          Que ($aparte.Count -eq $antes + 1) 'la carpeta de este intento, con su registro'
          Que (-not (Test-Path (Join-Path $aparte[-1].FullName 'pos.db'))) 'sin la base: regreso a su lugar'
          Que (Test-Path (Join-Path $aparte[-1].FullName 'restaurar.log')) 'con el registro de restaurar.ps1'
          # La marca que puso esta prueba: el servicio no la pudo quitar mientras estaba abierta (la base paso su revision).
          Remove-Item -LiteralPath $marcaDanada -Force -ErrorAction SilentlyContinue

      # El piloto alfa (2026-10-25): el registro del servicio en archivos, la clave de eleventa en su variable de entorno y juntar
      # los datos del piloto (docs/pruebas-en-tienda.md, «El piloto en la caja 2»).
      - name: El registro del servicio queda en registros\servicio-AAAA-MM-DD.log
        run: |
          . .github\instalacion\ayudas.ps1
          $registro = Join-Path $Datos ("registros\servicio-{0:yyyy-MM-dd}.log" -f (Get-Date))
          Que (Test-Path -LiteralPath $registro) "el servicio escribe su registro ($registro)"
          $texto = Get-Content -LiteralPath $registro -Raw -Encoding UTF8
          Que ($texto -match 'Empieza el registro del servicio: Papeler') 'cada vez que arranca lo dice'
          Que ($texto -match 'Termina el registro del servicio') 'y cuando se detiene bien'
          Que ($texto -match 'Respaldo en .+pos-.+\.db \(') 'con los respaldos de la base, su tamano y lo que tardaron'
          Que ($texto -notmatch 'Now listening on') 'sin lo informativo de Microsoft'

      - name: La clave de eleventa con poner-clave-eleventa.ps1 (y -Quitar)
        run: |
          . .github\instalacion\ayudas.ps1
          $script = Join-Path $Programa 'Servicio\poner-clave-eleventa.ps1'
          Que (Test-Path -LiteralPath $script) 'poner-clave-eleventa.ps1 esta junto al servicio, en Archivos de programa'
          Copy-Item -LiteralPath $ServicioJson -Destination (Join-Path $env:RUNNER_TEMP 'servicio-json-antes.json') -Force
          # La lectura de eleventa prendida, contra uno que no contesta (nadie escucha en ese puerto): con la clave, el servicio lo intenta.
          $json = "{`r`n  `"Eleventa`": { `"Activo`": true, `"Servidor`": `"127.0.0.1`", `"Puerto`": 1, `"Base`": `"C:\\eleventa\\PDVDATA.FDB`", `"SegundosMaximos`": 5 }`r`n}`r`n"
          [IO.File]::WriteAllText($ServicioJson, $json, (New-Object System.Text.UTF8Encoding $false))
          # Otra variable del servicio, que se tiene que quedar.
          $llave = 'HKLM:\SYSTEM\CurrentControlSet\Services\PapeleriaPos'
          New-ItemProperty -LiteralPath $llave -Name Environment -PropertyType MultiString -Value ([string[]]@('OTRA_VARIABLE=se-queda')) -Force | Out-Null
          $clave = 'clave-de-prueba-ci-7319'
          # En la tienda la pide sin que se vea; aquí va como cadena segura, en esta misma ventana.
          $salida = & $script -Clave (ConvertTo-SecureString $clave -AsPlainText -Force) -SegundosDeEspera 90 *>&1 | Out-String
          $codigo = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host $salida
          Que ($codigo -eq 2) "sin eleventa que conteste, termina con 2 (termino con $codigo)"
          Que ($salida -match 'Se puso la clave de eleventa en el servicio') 'dice que la puso'
          Que ($salida -match 'No contesta el eleventa de 127\.0\.0\.1') 'y que eleventa no contesto'
          Que (-not $salida.Contains($clave)) 'sin escribir la clave'
          $variables = @((Get-ItemProperty -LiteralPath $llave -Name Environment).Environment)
          Que ($variables -contains "Eleventa__Clave=$clave") 'la clave quedo en las variables del servicio'
          Que ($variables -contains 'OTRA_VARIABLE=se-queda') 'y la otra variable se quedo'
          Que ((Api 'eleventa').activa -eq $true) 'el servicio la tomo: su lectura de eleventa esta activa'
          Que (-not (Get-Content -LiteralPath $ServicioJson -Raw).Contains($clave)) 'servicio.json no la tiene'
          # -Quitar: la quita, las demás se quedan, y la lectura se apaga sola.
          $salida = & $script -Quitar *>&1 | Out-String
          $codigo = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host $salida
          Que ($codigo -eq 0) "-Quitar termino bien (termino con $codigo)"
          $variables = @((Get-ItemProperty -LiteralPath $llave -Name Environment).Environment)
          Que (@($variables | Where-Object { $_ -like 'Eleventa__Clave=*' }).Count -eq 0) 'se quito la clave'
          Que ($variables -contains 'OTRA_VARIABLE=se-queda') 'y la otra variable se quedo'
          $lectura = Api 'eleventa'
          Que (-not $lectura.activa -and $lectura.error -match 'la clave') "la lectura se apago: $($lectura.error)"
          # Otra vez puesta, para el paso siguiente (que nada de lo que se junta la traiga).
          & $script -Clave (ConvertTo-SecureString $clave -AsPlainText -Force) -SegundosDeEspera 30 *>&1 | Out-Null
          $global:LASTEXITCODE = 0
          Que (@((Get-ItemProperty -LiteralPath $llave -Name Environment).Environment) -contains "Eleventa__Clave=$clave") 'la clave otra vez puesta'

      - name: Juntar los datos del piloto con juntar-datos-piloto.ps1
        run: |
          . .github\instalacion\ayudas.ps1
          $script = Join-Path $Programa 'Servicio\juntar-datos-piloto.ps1'
          Que (Test-Path -LiteralPath $script) 'juntar-datos-piloto.ps1 esta junto al servicio, en Archivos de programa'
          $hoy = Get-Date -Format 'yyyy-MM-dd'
          $viejo = (Get-Date).AddDays(-40).ToString('yyyy-MM-dd')
          # Registros de mentiras junto a los de verdad (el servicio escribe el suyo y su bitácora de red): de hace 40 días, que no van.
          $registros = Join-Path $Datos 'registros'
          Set-Content -LiteralPath (Join-Path $registros "servicio-$viejo.log") -Value 'de hace 40 dias' -Encoding UTF8
          $conRed = Test-Path -LiteralPath (Join-Path $registros "red-servicio-$hoy.log")
          $deLaCaja = Join-Path $env:LOCALAPPDATA 'PapeleriaPos\registros'
          New-Item -ItemType Directory -Force -Path $deLaCaja | Out-Null
          # Con un secreto del servicio que se coló (no debería: el servicio los tacha): el script lo tacha en la copia.
          Set-Content -LiteralPath (Join-Path $deLaCaja "caja-$hoy.log") -Value "$hoy 10:00:00  Venta A-000001 - 2 renglones - CP-PRUEBA-CI-4410" -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $deLaCaja "red-caja-$hoy.log") -Value "$hoy 10:00:00  Empieza la bitacora de red" -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $deLaCaja "caja-$viejo.log") -Value 'de hace 40 dias' -Encoding UTF8
          # La caja dada de alta, con su llave: no va.
          $cajaJson = Join-Path $Datos 'Caja\caja.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $cajaJson) | Out-Null
          Set-Content -LiteralPath $cajaJson -Value '{ "Servicio": "http://localhost:5080/", "CajaId": null, "LlaveProtegida": "llave-de-prueba-que-no-va", "Impresora": "" }' -Encoding UTF8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # Otro secreto en las variables del servicio, como el código de Control Print (el PR que sigue): se revisa por su nombre.
          $llave = 'HKLM:\SYSTEM\CurrentControlSet\Services\PapeleriaPos'
          $variablesAntes = @((Get-ItemProperty -LiteralPath $llave -Name Environment).Environment)
          New-ItemProperty -LiteralPath $llave -Name Environment -PropertyType MultiString -Value ([string[]]($variablesAntes + 'ControlPrint__Codigo=CP-PRUEBA-CI-4410')) -Force | Out-Null

          # Con el usuario y el PIN del dueño: una copia de la base de este momento (Respaldar ahora).
          $destino = Join-Path $env:RUNNER_TEMP 'datos-del-piloto'
          $salida = & $script -Destino $destino -Dias 3 -Usuario dueno -Pin (ConvertTo-SecureString '3333' -AsPlainText -Force) *>&1 | Out-String
          $codigo = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host $salida
          Que ($codigo -eq 0) "termino bien (termino con $codigo)"
          Que ($salida -match 'ControlPrint__Codigo estaba en caja-') 'dice que tacho el codigo de Control Print en la copia'
          $zips = @(Get-ChildItem -LiteralPath $destino -Filter 'datos-piloto-*.zip')
          Que ($zips.Count -eq 1) "dejo un .zip en el destino ($($zips.Name -join ', '))"
          # El respaldo del que salio la copia sigue con los PIN (con el se sigue entrando); la copia del .zip, no.
          $ahora = @(Get-ChildItem -LiteralPath (Join-Path $Datos 'respaldos') -Filter 'pos-*-ahora-*.db' | Sort-Object LastWriteTime -Descending)[0]
          Que ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($ahora.FullName)).Contains('pbkdf2-sha256$')) "el respaldo $($ahora.Name) sigue con los PIN"
          $zip = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $nombres = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            Write-Host ($nombres -join "`n")
            Que ($nombres -contains 'LEEME.txt') 'con LEEME.txt'
            Que (@($nombres | Where-Object { $_ -match '^base/pos-.+-ahora-\d{4}\.db$' }).Count -eq 1) 'con la copia de la base de este momento (Respaldar ahora)'
            Que (@($nombres | Where-Object { $_ -match '^base/' }).Count -eq 1) 'y nada mas en base/ (ni su .tmp ni lo de SQLite)'
            $base = $zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -match '^base/pos-' }
            $memoria = New-Object System.IO.MemoryStream
            $flujo = $base.Open()
            try { $flujo.CopyTo($memoria) } finally { $flujo.Dispose() }
            Que (-not [Text.Encoding]::ASCII.GetString($memoria.ToArray()).Contains('pbkdf2-sha256$')) 'la copia de la base del .zip va sin los PIN'
            Que ($nombres -contains 'csv/envios-a-eleventa.csv' -and $nombres -contains 'csv/bitacora.csv') 'con los CSV de la bandeja y de la bitacora'
            Que ($nombres -contains 'configuracion/servicio.json' -and $nombres -contains 'configuracion/caja.json') 'con servicio.json y caja.json'
            Que ($nombres -contains "registros/servicio/servicio-$hoy.log") 'con el registro del servicio de hoy'
            Que (-not $conRed -or $nombres -contains "registros/servicio/red-servicio-$hoy.log") 'y su bitacora de red de hoy'
            Que (@($nombres | Where-Object { $_ -match "^registros/caja/[^/]+/caja-$hoy\.log$" }).Count -eq 1) 'con el registro de la caja de hoy'
            Que (@($nombres | Where-Object { $_ -match "^registros/caja/[^/]+/red-caja-$hoy\.log$" }).Count -eq 1) 'y su bitacora de red'
            Que (@($nombres | Where-Object { $_ -match $viejo }).Count -eq 0) 'sin lo de hace 40 dias'
            $textos = @{}
            foreach ($entrada in @($zip.Entries | Where-Object { $_.Name -match '\.(log|csv|json|txt)$' })) {
              $lector = New-Object System.IO.StreamReader($entrada.Open())
              try { $textos[$entrada.FullName.Replace('\', '/')] = $lector.ReadToEnd() } finally { $lector.Dispose() }
            }
            foreach ($nombre in $textos.Keys) {
              Que (-not $textos[$nombre].Contains('clave-de-prueba-ci-7319')) "$nombre no trae la clave de eleventa"
              Que (-not $textos[$nombre].Contains('llave-de-prueba-que-no-va')) "$nombre no trae la llave de la caja"
              Que (-not $textos[$nombre].Contains('"pin":"3333"')) "$nombre no trae el PIN"
              Que (-not $textos[$nombre].Contains('CP-PRUEBA-CI-4410')) "$nombre no trae el codigo de Control Print"
            }
            Que ($textos['LEEME.txt'] -match 'sin los PIN') 'LEEME.txt dice que la base va sin los PIN'
            Que ($textos['configuracion/caja.json'] -match '"LlaveProtegida": "\(quitado\)"') 'caja.json dice (quitado) en lugar de la llave'
            Que ($textos['LEEME.txt'] -match 'una copia de este momento') 'LEEME.txt dice de donde salio la copia'
            Que ($textos['csv/envios-a-eleventa.csv'] -match '^\uFEFF?Env') 'el CSV de la bandeja con sus encabezados'
            Que ($textos["registros/servicio/servicio-$hoy.log"] -match 'Lectura de eleventa . no se pudo') 'el registro del servicio trae las lecturas de eleventa'
          } finally {
            $zip.Dispose()
          }

          # Sin PIN: el respaldo más reciente.
          $destino = Join-Path $env:RUNNER_TEMP 'datos-del-piloto-sin-pin'
          $salida = & $script -Destino $destino -SinPin *>&1 | Out-String
          $codigo = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host $salida
          Que ($codigo -eq 0) "sin PIN termino bien (termino con $codigo)"
          $zips = @(Get-ChildItem -LiteralPath $destino -Filter 'datos-piloto-*.zip')
          Que ($zips.Count -eq 1) 'dejo su .zip'
          $zip = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $lector = New-Object System.IO.StreamReader(($zip.Entries | Where-Object { $_.FullName -eq 'LEEME.txt' }).Open())
            try { $leeme = $lector.ReadToEnd() } finally { $lector.Dispose() }
            Que ($leeme -match 'el respaldo mas reciente') 'LEEME.txt dice que es el respaldo mas reciente'
            Que (@($zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -match '^base/pos-.+\.db$' }).Count -eq 1) 'con su copia de la base'
          } finally {
            $zip.Dispose()
          }

          # Nunca en OneDrive: a una carpeta de OneDrive, lo deja en ProgramData\PapeleriaPos\datos-del-piloto y lo dice.
          $env:OneDrive = Join-Path $env:RUNNER_TEMP 'OneDrive-de-prueba'
          New-Item -ItemType Directory -Force -Path $env:OneDrive | Out-Null
          $salida = & $script -Destino (Join-Path $env:OneDrive 'Escritorio') -SinPin *>&1 | Out-String
          $codigo = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Remove-Item Env:\OneDrive
          Write-Host $salida
          Que ($codigo -eq 0) "a OneDrive termino bien (termino con $codigo)"
          Que ($salida -match 'esta en OneDrive') 'dice que esa carpeta esta en OneDrive'
          $carpetaLocal = Join-Path $Datos 'datos-del-piloto'
          Que (@(Get-ChildItem -LiteralPath $carpetaLocal -Filter 'datos-piloto-*.zip' -ErrorAction SilentlyContinue).Count -eq 1) "el .zip quedo en $carpetaLocal"
          Que (@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'OneDrive-de-prueba') -Recurse -File).Count -eq 0) 'y nada en OneDrive'
          Remove-Item -LiteralPath $carpetaLocal -Recurse -Force
          New-ItemProperty -LiteralPath $llave -Name Environment -PropertyType MultiString -Value ([string[]]$variablesAntes) -Force | Out-Null
          Que (@(Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'datos-piloto-*').Count -eq 0) 'sin dejar su carpeta de trabajo'
          # Como estaba: servicio.json del paso de antes.
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'servicio-json-antes.json') -Destination $ServicioJson -Force

      - name: Quitar todo
        run: |
          . .github\instalacion\ayudas.ps1
          $r = Correr (Join-Path $Paquetes 'v2\caja\instalar-caja.ps1') @('-Quitar')
          Que ($r.Codigo -eq 0) 'instalar-caja.ps1 -Quitar termino bien'
          $r = Correr (Join-Path $Paquetes 'v2\servicio\instalar-servicio.ps1') @('-Quitar')
          Que ($r.Codigo -eq 0) 'instalar-servicio.ps1 -Quitar termino bien'
          Que (Esperar-Sin-Servicio) 'ya no esta el servicio'
          Que (-not (Test-Path (Join-Path $Programa 'Servicio'))) 'ni su programa'
          Que (-not (Test-Path (Join-Path $Programa 'Caja'))) 'ni la caja'
          Que ((Test-Path $ServicioJson) -and (Marca revisar)) 'la base, con su marca, y servicio.json se quedan'

      - name: Si algo fallo, los registros de actualizar.ps1 y lo que dijo Windows del servicio
        if: failure()
        run: |
          $actualizaciones = Join-Path $env:ProgramData 'PapeleriaPos\actualizaciones'
          foreach ($registro in @(Get-ChildItem -LiteralPath $actualizaciones -Recurse -Filter 'actualizar.log' -ErrorAction SilentlyContinue)) {
            Write-Host "===== $($registro.FullName)"
            Get-Content -LiteralPath $registro.FullName
          }
          foreach ($registro in @(Get-ChildItem -Path (Join-Path $env:ProgramData 'PapeleriaPos\antes-de-restaurar-*\restaurar.log') -ErrorAction SilentlyContinue)) {
            Write-Host "===== $($registro.FullName)"
            Get-Content -LiteralPath $registro.FullName
          }
          foreach ($registro in @(Get-ChildItem -Path (Join-Path $env:ProgramData 'PapeleriaPos\registros\servicio-*.log') -ErrorAction SilentlyContinue)) {
            Write-Host "===== $($registro.FullName) (lo ultimo)"
            Get-Content -LiteralPath $registro.FullName -Encoding UTF8 -Tail 200
          }
          Write-Host '===== El servicio'
          Get-CimInstance -ClassName Win32_Service -Filter "Name='PapeleriaPos'" | Format-List Name, State, StartMode, PathName, ProcessId
          Write-Host '===== El Visor de eventos (la ultima hora)'
          $desde = (Get-Date).AddHours(-1)
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $desde } -MaxEvents 500 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -like 'PapeleriaPos*' -or $_.Message -match 'PapeleriaPos' } |
            Sort-Object TimeCreated | Format-List TimeCreated, ProviderName, LevelDisplayName, Message
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; StartTime = $desde } -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Papeleria' } | Sort-Object TimeCreated | Format-List TimeCreated, Id, Message

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: registros-de-actualizar
          path: C:/ProgramData/PapeleriaPos/actualizaciones/*/actualizar.log
          if-no-files-found: ignore
          retention-days: 7
